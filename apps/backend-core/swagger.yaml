openapi: 3.0.0
info:
  title: AWAS-AI Backend Core API
  description: Backend Core Service API for AWAS-AI
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: Development server

paths:
  /health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Service is healthy

  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, phone, name, password]
              properties:
                email:
                  type: string
                phone:
                  type: string
                name:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: User created

  /auth/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emailOrPhone, password]
              properties:
                emailOrPhone:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful