openapi: 3.0.0
info:
  title: AWAS Home API
  version: 1.0.0
  description: Production API for AWAS Home Customer App
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
paths:
  /auth/google:
    post:
      summary: Login or Register with Google
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idToken:
                  type: string
      responses:
        '200':
          description: Login successful
  /auth/send-otp:
    post:
      summary: Send OTP to phone
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
      responses:
        '200':
          description: OTP sent
  /auth/verify-otp:
    post:
      summary: Verify OTP
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                otp:
                  type: string
      responses:
        '200':
          description: OTP verified
  /auth/refresh-token:
    post:
      summary: Refresh access token
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Tokens refreshed
  /users/me:
    get:
      summary: Get user profile
      tags: [Users]
      responses:
        '200':
          description: Profile retrieved
    put:
      summary: Update user profile
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                avatar:
                  type: string
                phone:
                  type: string
      responses:
        '200':
          description: Profile updated
  /users/address:
    post:
      summary: Add new address
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                address:
                  type: string
                city:
                  type: string
                state:
                  type: string
                zipCode:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
      responses:
        '201':
          description: Address created
  /users/addresses:
    get:
      summary: Get user addresses
      tags: [Users]
      responses:
        '200':
          description: Addresses retrieved
  /bookings/categories:
    get:
      summary: Get service categories
      tags: [Bookings]
      responses:
        '200':
          description: Categories retrieved
  /bookings/services:
    get:
      summary: Get services
      tags: [Bookings]
      responses:
        '200':
          description: Services retrieved
  /bookings:
    post:
      summary: Create a new booking
      tags: [Bookings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                serviceId:
                  type: string
                addressId:
                  type: string
                scheduledFor:
                  type: string
                  format: date-time
                notes:
                  type: string
      responses:
        '201':
          description: Booking created
    get:
      summary: Get customer bookings
      tags: [Bookings]
      responses:
        '200':
          description: Bookings retrieved
  /bookings/{id}:
    get:
      summary: Get booking by ID
      tags: [Bookings]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Booking retrieved
  /wallet:
    get:
      summary: Get wallet balance
      tags: [Wallet]
      responses:
        '200':
          description: Wallet retrieved
  /wallet/transactions:
    get:
      summary: Get wallet transactions
      tags: [Wallet]
      responses:
        '200':
          description: Transactions retrieved
  /notifications:
    get:
      summary: Get notifications
      tags: [Notifications]
      responses:
        '200':
          description: Notifications retrieved
  /notifications/read:
    post:
      summary: Mark notifications as read
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notificationIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Notifications marked as read
  /ai/scan:
    post:
      summary: Process an appliance image scan
      tags: [AI]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                imageUrl:
                  type: string
      responses:
        '200':
          description: Scan processed
  /ai/history:
    get:
      summary: Get AI diagnostic history
      tags: [AI]
      responses:
        '200':
          description: History retrieved
