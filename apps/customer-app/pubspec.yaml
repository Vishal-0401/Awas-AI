name: awas_customer_app
description: AWAS-AI Customer Mobile Application - AI-powered home services platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^12.1.1

  # Networking
  dio: ^5.3.3
  socket_io_client: ^2.0.3+1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0

  # Maps & Location
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Camera & Image
  image_picker: ^1.0.4
  # Pin to a version with working web implementation.
  image_cropper: ^8.0.0



  # Firebase
  firebase_core: ^2.24.2
  firebase_messaging: ^14.9.1


  firebase_analytics: ^10.7.4


  # Utilities
  intl: any
  uuid: ^4.2.1
  url_launcher: ^6.2.1
  share_plus: ^7.2.1
  permission_handler: ^11.1.0
  connectivity_plus: ^5.0.2
  device_info_plus: ^9.1.1

  # Forms & Validation
  flutter_form_builder: ^9.2.1

  # UI Libraries
  flutter_screenutil: ^5.9.0
  gap: ^3.0.1
  lottie: ^2.7.0
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

  # Linting
  flutter_lints: ^3.0.1
  very_good_analysis: ^5.1.0

flutter:
  uses-material-design: true

  assets: []

  # Fonts removed because assets/fonts directory (and Poppins TTF files) are missing.
  # Add the actual font files and then restore this section when available.
  fonts: []

